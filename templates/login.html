{% extends "base.html" %}
{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-sm">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-blue-100 mb-3">
        <i data-lucide="log-in" class="w-6 h-6 text-blue-600"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-100">Welcome Back</h2>
      <p class="text-slate-500 text-sm mt-1">Sign in to your expense tracker</p>
    </div>

    <!-- Login Card -->
    <div class="bg-slate-900 rounded-lg border border-slate-700 p-6 shadow-sm">
      <form method="POST" class="space-y-4">
        <!-- Username -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
          <div class="relative">
            <i data-lucide="user" class="absolute left-3 top-3 w-4 h-4 text-slate-600"></i>
            <input type="text" name="username" required 
              class="w-full pl-10 pr-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
              placeholder="Enter your username">
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-3 w-4 h-4 text-slate-600"></i>
            <input type="password" id="password" name="password" required 
              class="w-full pl-10 pr-10 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
              placeholder="Enter your password">
            <button type="button" onclick="togglePassword('password')" 
              class="absolute right-3 top-3 text-slate-600 hover:text-slate-400 transition-colors">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Login Button -->
        <button type="submit" 
          class="w-full py-2 px-4 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition-colors duration-200">
          Sign In
        </button>

        <!-- Divider -->
        <div class="relative my-4">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-700"></div>
          </div>
          <div class="relative flex justify-center text-xs">
            <span class="px-3 bg-slate-900 text-slate-500">or continue with</span>
          </div>
        </div>

        <!-- Google Button -->
        <a href="{{ url_for('google_login') }}" 
          class="flex items-center justify-center gap-2 w-full py-2 px-4 bg-slate-800 text-slate-300 font-medium rounded-lg hover:bg-slate-700 transition-colors">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Google
        </a>
      </form>

      <!-- Register Link -->
      <p class="text-center text-slate-400 text-sm mt-4">
        Don't have an account? 
        <a href="{{ url_for('register') }}" class="text-blue-600 hover:text-blue-700 font-medium">Sign up</a>
      </p>
    </div>
  </div>
</div>

<script>
  function togglePassword(fieldId) {
    const field = document.getElementById(fieldId);
    const icon = field.nextElementSibling.querySelector('i');
    if (field.type === 'password') {
      field.type = 'text';
      icon.setAttribute('data-lucide', 'eye-off');
    } else {
      field.type = 'password';
      icon.setAttribute('data-lucide', 'eye');
    }
    lucide.createIcons();
  }
</script>
{% endblock %}
